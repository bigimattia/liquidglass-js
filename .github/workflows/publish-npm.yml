name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Check npm trusted publishing support
        run: |
          mise exec -- node -e 'const v = require("child_process").execFileSync("npm", ["--version"], {encoding: "utf8"}).trim().split(".").map(Number); if (v[0] < 11 || (v[0] === 11 && (v[1] < 5 || (v[1] === 5 && v[2] < 1)))) { throw new Error("npm 11.5.1 or later is required for trusted publishing"); }'
      - name: Install dependencies
        run: mise run install
      - name: Build and check
        run: mise run check
      - name: Publish to npm
        run: mise exec -- npm publish --access public
