name: Release and stage on npm

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - name: Determine release version
        id: version
        run: |
          version=$(mise exec -- node -p "require('./package.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $tag."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            tag_commit=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag $tag already points to a different commit."
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        run: mise run install
      - name: Build, check, and package
        run: mise run pack
      - name: Configure npm registry
        uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org/
      - name: Stage package on npm
        run: npm stage publish ./dist/*.tgz --access public --tag "${{ steps.version.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.tgz
          body: |
            This version is staged on npm and requires maintainer approval before it is available.
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
